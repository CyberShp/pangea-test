name: Apply deterministic analysis report

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/render-analysis-model' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-analysis-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict validator
        run: python -m pip install -r runtime/requirements-strict.txt
      - name: Apply report projection
        run: |
          python .github/scripts/apply_analysis_report_projection.py
          python .github/scripts/fix_analysis_report_tests.py
      - name: Compile Python
        run: python -m py_compile runtime/analysis_reporting.py runtime/reporting.py runtime/runctl.py tests/test_analysis_report_projection.py tests/test_e2e_v2.py
      - name: Run focused tests
        run: python -m unittest tests.test_analysis_report_projection tests.test_analysis_depth_contract tests.test_reporting tests.test_workflows_v2 tests.test_e2e_v2
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/scripts/apply_analysis_report_projection.py
          rm .github/scripts/fix_analysis_report_tests.py
          rm .github/workflows/agent-analysis-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: render reports from fixed analysis models"
          git push origin HEAD:agent/render-analysis-model
