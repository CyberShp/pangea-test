name: Harden evidence provenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'agent/evidence-provenance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-provenance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict validator
        run: python -m pip install -r runtime/requirements-strict.txt
      - name: Apply hardening
        run: |
          python .github/scripts/harden_evidence_provenance.py
          python .github/scripts/fix_evidence_hardening_test.py
      - name: Compile Python
        run: python -m py_compile runtime/evidence_runtime.py runtime/runctl.py tests/test_evidence_provenance.py
      - name: Run focused tests
        run: python -m unittest tests.test_evidence_provenance tests.test_contract_lifecycle tests.test_analysis_depth_contract tests.test_workflows_v2 tests.test_e2e_v2 tests.test_agent_v2
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify diff
        run: git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          rm .github/scripts/harden_evidence_provenance.py
          rm .github/scripts/fix_evidence_hardening_test.py
          rm .github/workflows/agent-evidence-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind MR facts to the fixed diff artifact"
          git push origin HEAD:agent/evidence-provenance
