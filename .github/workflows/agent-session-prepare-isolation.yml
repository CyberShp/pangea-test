name: Apply session prepare isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/isolate-session-prepare-steps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused changes
        shell: bash
        run: |
          if [ ! -f tools/agent_apply_session_prepare_isolation.py ]; then
            echo "apply script not staged yet"
            exit 0
          fi
          python tools/agent_apply_session_prepare_isolation.py
      - name: Run focused tests
        if: hashFiles('tools/agent_apply_session_prepare_isolation.py') != ''
        run: python -m unittest tests.test_session_prepare_isolation tests.test_data_runtime tests.test_cli_v2
      - name: Commit implementation
        if: hashFiles('tools/agent_apply_session_prepare_isolation.py') != ''
        shell: bash
        run: |
          rm tools/agent_apply_session_prepare_isolation.py
          rm .github/workflows/agent-session-prepare-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate session prepare steps"
          git push origin HEAD:agent/isolate-session-prepare-steps
