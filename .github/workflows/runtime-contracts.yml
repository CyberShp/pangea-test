name: Runtime Contracts

on:
  pull_request:
    paths:
      - "registry/**"
      - "schemas/**"
      - "runtime/**"
      - "tests/**"
      - "adapters/opencode/.opencode/**"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "schemas/**"
      - "runtime/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r runtime/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m py_compile runtime/runctl.py
