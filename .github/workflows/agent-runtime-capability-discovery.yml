name: Apply runtime capability discovery fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-capability-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused changes
        shell: bash
        run: |
          if [ ! -f tools/agent_apply_runtime_capability_discovery.py ]; then
            echo "apply script not staged yet"
            exit 0
          fi
          python tools/agent_apply_runtime_capability_discovery.py
      - name: Run focused tests
        if: hashFiles('tools/agent_apply_runtime_capability_discovery.py') != ''
        run: python -m unittest tests.test_capabilities tests.test_runtime_capability_discovery tests.test_agent_v2 tests.test_cli_v2
      - name: Commit implementation
        if: hashFiles('tools/agent_apply_runtime_capability_discovery.py') != ''
        shell: bash
        run: |
          rm tools/agent_apply_runtime_capability_discovery.py
          rm .github/workflows/agent-runtime-capability-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: discover runtime capabilities portably"
          git push origin HEAD:agent/fix-runtime-capability-discovery
