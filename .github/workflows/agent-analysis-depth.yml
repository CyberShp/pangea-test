name: Apply analysis depth contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/restore-analysis-depth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-analysis-depth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict validator
        run: python -m pip install -r runtime/requirements-strict.txt
      - name: Apply analysis contract
        run: |
          python .github/scripts/fix_analysis_depth_patcher.py
          python .github/scripts/apply_analysis_depth_contract.py
          python .github/scripts/fix_analysis_depth_runtime.py
          python .github/scripts/fix_analysis_depth_e2e.py
      - name: Compile Python
        run: python -m py_compile runtime/runctl.py tests/test_analysis_depth_contract.py tests/test_e2e_v2.py
      - name: Run focused tests
        run: python -m unittest tests.test_analysis_depth_contract tests.test_workflows_v2 tests.test_agent_v2 tests.test_reporting tests.test_e2e_v2
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/scripts/apply_analysis_depth_contract.py
          rm .github/scripts/fix_analysis_depth_patcher.py
          rm .github/scripts/fix_analysis_depth_runtime.py
          rm .github/scripts/fix_analysis_depth_e2e.py
          rm .github/workflows/agent-analysis-depth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore complete analysis depth contract"
          git push origin HEAD:agent/restore-analysis-depth
