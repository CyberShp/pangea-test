name: Apply Windows subprocess fix on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-windows-subprocess-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused changes
        shell: bash
        run: |
          if [ ! -f tools/agent_apply_windows_subprocess_fix.py ]; then
            echo "apply script not staged yet"
            exit 0
          fi
          python tools/agent_apply_windows_subprocess_fix.py
      - name: Run focused tests
        if: hashFiles('tools/agent_apply_windows_subprocess_fix.py') != ''
        run: python -m unittest tests.test_windows_subprocess tests.test_data_runtime tests.test_index_runtime tests.test_capabilities
      - name: Commit implementation
        if: hashFiles('tools/agent_apply_windows_subprocess_fix.py') != ''
        shell: bash
        run: |
          rm tools/agent_apply_windows_subprocess_fix.py
          rm .github/workflows/agent-fix-windows-subprocess-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Windows subprocess capture"
          git push origin HEAD:agent/fix-windows-subprocess-capture
