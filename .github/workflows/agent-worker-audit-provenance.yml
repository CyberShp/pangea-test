name: Apply worker and audit provenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/worker-audit-provenance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/worker-audit-provenance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict validator
        run: python -m pip install -r runtime/requirements-strict.txt
      - name: Apply provenance implementation
        run: |
          python .github/scripts/fix_worker_migration_script.py
          python .github/scripts/apply_worker_audit_provenance.py
          python .github/scripts/fix_worker_compatibility.py
      - name: Compile Python
        run: python -m py_compile runtime/data_runtime.py runtime/runctl.py runtime/coverage_judge.py tests/test_worker_audit_provenance.py
      - name: Run focused tests
        run: python -m unittest tests.test_worker_audit_provenance tests.test_evidence_provenance tests.test_analysis_depth_contract tests.test_contract_lifecycle tests.test_coverage_judge tests.test_workflows_v2 tests.test_e2e_v2 tests.test_agent_v2
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/scripts/apply_worker_audit_provenance.py
          rm .github/scripts/fix_worker_migration_script.py
          rm .github/scripts/fix_worker_compatibility.py
          rm .github/workflows/agent-worker-audit-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bind workers checkpoints and auditor inputs"
          git push origin HEAD:agent/worker-audit-provenance
