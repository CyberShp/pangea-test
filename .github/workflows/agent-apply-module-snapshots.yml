name: Apply module snapshot fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/bind-module-analysis-snapshots' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bind-module-analysis-snapshots
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/scripts/apply_module_snapshots.py
      - name: Compile modified Python
        run: python -m py_compile runtime/runctl.py runtime/repository_runtime.py tests/test_module_snapshot_binding.py
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/scripts/apply_module_snapshots.py
          rm .github/workflows/agent-apply-module-snapshots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A runtime schemas .opencode tests .github
          git commit -m "fix: bind module analysis to commit snapshots"
          git push origin HEAD:agent/bind-module-analysis-snapshots
