name: Apply workspace layout refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/clean-workspace-layout' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-workspace-layout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict validator
        run: python -m pip install -r runtime/requirements-strict.txt
      - name: Apply refactor
        run: |
          python .github/scripts/apply_workspace_layout.py
          python .github/scripts/fix_workspace_layout_tests.py
          python .github/scripts/fix_workspace_layout_round2.py
          python .github/scripts/fix_workspace_layout_round3.py
      - name: Compile modified Python
        run: python -m py_compile runtime/data_runtime.py runtime/library_runtime.py runtime/runctl.py runtime/repository_runtime.py tests/test_workspace_layout_v2.py
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify tracked layout
        shell: bash
        run: |
          test -z "$(git ls-files source inputs workspace outputs projects runs)"
          test ! -e core/modules
          test ! -e core/protocols
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/scripts/apply_workspace_layout.py
          rm .github/scripts/fix_workspace_layout_tests.py
          rm .github/scripts/fix_workspace_layout_round2.py
          rm .github/scripts/fix_workspace_layout_round3.py
          rm .github/workflows/agent-layout-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: clarify reports and run artifacts"
          git push origin HEAD:agent/clean-workspace-layout
